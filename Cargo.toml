[package]
name = "rust-starterkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"
default-run = "rust-starterkit"

[dependencies]
axum = { version = "0.8.9", features = ["json"] }
sea-orm = { version = "2.0.3", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid"] }
sea-orm-migration = { version = "2.0.3", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
utoipa = { version = "6", features = ["uuid"] }
uuid = { version = "1", features = ["v7", "serde"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = "thin"

[lints.rust]
unsafe_code = "forbid"
